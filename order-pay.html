<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pay|Brew Haven</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.jpg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="payment-container">
    <h1>Payment</h1>
    <form>
        <label for="form-of-payment">Form of Payment:</label>
        <select id="form-of-payment" name="form-of-payment" required>
            <option value="credit">Credit Card</option>
            <option value="debit">Debit Card</option>
        </select>
        <label for="card-number">Card Number:</label>
        <input type="text" id="card-number" name="card-number" required>
        <label for="expiry-date">Expiry Date:</label>
        <input type="text" id="expiry-date" name="expiry-date" required>
        <label for="cvv">CVV:</label>
        <input type="text" id="cvv" name="cvv" required>
        <button type="submit">Pay Now</button>
        <br><br>
        <label for="pay-at-delivery">Or choose to pay at delivery:</label>
        <button type="submit">Pay At Delivery</button>
    </form>
<button onclick="window.location.href='menu.html'" class="back-btn">Back to Menu</button>
    </div>
    
<script>
    document.querySelector('form').addEventListener('submit', function(event) {
        event.preventDefault();
        alert('Payment successful! Thank you for your order.');
        window.location.href = 'index.html';
    });
</script>

    <footer class="footer">

    <div class="footer-grid">

        <!-- Logo -->
        <div class="footer-logo">
            <h2>Brew Haven</h2>
            <p>Fresh Coffee, Fresh Moments.</p>
        </div>

        <!-- Quick Links -->
        <div class="footer-links">
            <h3>Quick Links</h3>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="index.html#about">About</a></li>
            </ul>
        </div>

        <!-- Social Media -->
        <div class="footer-social">
            <h3>Follow Us</h3>
            <a href="#">📘 Facebook</a><br>
            <a href="#">📷 Instagram</a><br>
            <a href="#">🐦 X (Twitter)</a>
        </div>

        <!-- Copyright -->
        <div class="footer-copy">
            <h3>Copyright</h3>
            <p>© 2026 Brew Haven.<br>All Rights Reserved.</p>
            <p>This is not a real website.Project of student of Crestbridge College</p>
        </div>

    </div>

</footer>

</body>
</html>
